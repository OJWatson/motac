[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "motac"
version = "0.1.0"
description = "JAX/NumPyro discrete-time mobility-constrained Hawkes models"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "motac3" }]
dependencies = [
  "jax>=0.4.30",
  "jaxlib>=0.4.30",
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "numpyro>=0.15",
  "optax>=0.2.3",
]

[project.scripts]
motac-bench = "motac.cli:run_benchmarks"

[project.optional-dependencies]
data = [
  "sodapy>=2.2.0",
  "acled-viz>=0.1.0",
]
neural = [
  "flax>=0.10.0",
]
sbi = [
  "sbijax>=0.4.0",
  "distrax>=0.1.5",
]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.10",
  "pre-commit>=3.7",
]
docs = [
  "sphinx>=8.0",
  "pydata-sphinx-theme>=0.15",
  "myst-parser>=3.0",
  "nbsphinx>=0.9",
  "sphinxcontrib-bibtex>=2.6",
]

[tool.setuptools.packages.find]
include = ["motac*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "unit: fast deterministic unit tests",
  "integration: integration tests",
  "slow: slow tests",
  "network: tests requiring network access",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
