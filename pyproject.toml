[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "motac"
version = "0.1.0"
description = "Experimental JAX/NumPyro tooling for mobility-constrained Hawkes count models"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "OJ Watson" }]
maintainers = [{ name = "OJ Watson" }]
keywords = ["jax", "numpyro", "hawkes", "forecasting", "spatial", "mobility"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "jax>=0.4.30",
  "jaxlib>=0.4.30",
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "numpyro>=0.15",
  "optax>=0.2.3",
]

[project.scripts]
motac-bench = "motac.cli:run_benchmarks"

[project.optional-dependencies]
data = [
  "sodapy>=2.2.0",
  "acled-viz>=0.1.0",
]
neural = [
  "flax>=0.10.0",
]
sbi = [
  "sbijax>=0.4.0",
  "distrax>=0.1.5",
]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.10",
  "pre-commit>=3.7",
  "build>=1.2",
]
docs = [
  "sphinx>=8.0",
  "pydata-sphinx-theme>=0.15",
  "myst-parser>=3.0",
  "nbsphinx>=0.9",
  "sphinxcontrib-bibtex>=2.6",
  "ipython>=8.18",
]

[project.urls]
Homepage = "https://github.com/OJWatson/motac"
Repository = "https://github.com/OJWatson/motac"
Documentation = "https://ojwatson.github.io/motac/"
Issues = "https://github.com/OJWatson/motac/issues"
Changelog = "https://github.com/OJWatson/motac/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["motac*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "unit: fast deterministic unit tests",
  "integration: integration tests",
  "slow: slow tests",
  "network: tests requiring network access",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
