repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.4
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.19.1
    hooks:
      - id: mypy
        args: ["--config-file=pyproject.toml"]

  - repo: local
    hooks:
      - id: pytest
        name: pytest quick
        entry: python3.11 -m pytest -q -m "not slow"
        language: system
        pass_filenames: false
        stages: [pre-push]
