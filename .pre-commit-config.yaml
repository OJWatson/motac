repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.4
    hooks:
      - id: ruff
        args: ["--select", "F"]

  - repo: local
    hooks:
      - id: py-compile
        name: py_compile quick
        entry: sh -c 'python3.11 -m py_compile src/motac/*.py tests/*.py'
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: pytest
        name: pytest quick
        entry: python3.11 -m pytest -q -m "not slow"
        language: system
        pass_filenames: false
        stages: [pre-push]
